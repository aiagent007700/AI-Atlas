services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DOCUSAURUS_BASE_URL=/
      - DOCUSAURUS_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
    command: ["sh", "-ec", "npm install && exec npx docusaurus start --host 0.0.0.0 --port 3000 --no-open"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
